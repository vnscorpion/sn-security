# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
[advisories]
yanked = "deny"
# proc-macro-error is unmaintained (pulled in transitively by a proc-macro dep);
# there is no drop-in fix, so we acknowledge it rather than fail the build.
ignore = ["RUSTSEC-2024-0370"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Our path dependency (snsec-common) has no version requirement, which otherwise
# reads as a wildcard. Allow that for intra-workspace path deps only.
allow-wildcard-paths = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
