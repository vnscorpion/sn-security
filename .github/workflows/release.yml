name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.arch }}-unknown-linux-musl
      - name: build
        run: cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl --locked
      - name: stage
        run: |
          mkdir -p out
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/sn    out/sn-${{ matrix.arch }}
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/snhub out/snhub-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: out/*

  release:
    name: package + publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble dist
        run: |
          mkdir -p dist
          cp artifacts/bin-x86_64/sn-x86_64       dist/sn-x86_64
          cp artifacts/bin-x86_64/snhub-x86_64    dist/snhub-x86_64
          cp artifacts/bin-aarch64/sn-aarch64     dist/sn-aarch64
          cp artifacts/bin-aarch64/snhub-aarch64  dist/snhub-aarch64
          cp deploy/install.sh dist/install.sh
          cd dist && sha256sum sn-* snhub-* install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: sign SHA256SUMS (optional)
        if: ${{ env.MINISIGN_SECRET != '' }}
        env:
          MINISIGN_SECRET: ${{ secrets.MINISIGN_SECRET }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_SECRET" > /tmp/minisign.key
          minisign -S -s /tmp/minisign.key -m dist/SHA256SUMS
          rm -f /tmp/minisign.key

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sn-x86_64
            dist/sn-aarch64
            dist/snhub-x86_64
            dist/snhub-aarch64
            dist/install.sh
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
          fail_on_unmatched_files: false
          generate_release_notes: true
