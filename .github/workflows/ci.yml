name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the tag it had in the comment: a tag can be
# moved to other code, a commit cannot.
jobs:
  test:
    name: fmt + clippy + test (native linux)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # A failing test is named in an annotation (with its panic and left/right
      # lines), so it can be read without downloading the job log.
      - name: test
        run: |
          set -o pipefail
          if ! cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            awk '
              /^---- .* stdout ----$/ { if (msg != "") print msg; msg = $2; next_too = 0; next }
              msg != "" && (next_too || /panicked at|^ *left:|^ *right:|assertion/) {
                if (length(msg) < 900) msg = msg "%0A" $0
                next_too = /panicked at/
              }
              END { if (msg != "") print msg }
            ' "$RUNNER_TEMP/test.log" | head -n 10 | while IFS= read -r m; do
              echo "::error title=test failed::$m"
            done
            exit 1
          fi

  build-musl:
    name: static musl build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Sets up the musl cross C toolchain (CC/AR/linker) so the C deps
      # (ring, rusqlite, mimalloc) cross-compile reliably.
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.arch }}-unknown-linux-musl
      - name: build
        run: cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl --locked
      - name: size
        run: ls -la target/${{ matrix.arch }}-unknown-linux-musl/release/sn target/${{ matrix.arch }}-unknown-linux-musl/release/snhub

  # Runs the real install/update scripts as root on the runner against a local
  # "release" (this build of snhub, a stand-in sn, the dist/ installer) and checks
  # what they leave. Hubs serve dist/, not deploy/: the scripts download
  # dist/install.sh and the dist/ binaries, so those are what is checked here.
  deploy:
    name: deploy scripts (hub install + update, agent installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: shell syntax
        run: |
          for f in deploy/*.sh; do
            case "$(head -n 1 "$f")" in
              *bash*) bash -n "$f" ;;
              *) dash -n "$f" ;;
            esac
          done
      - name: dist/ holds this tree's installer and verified checksums
        run: |
          cmp deploy/install.sh dist/install.sh || {
            echo "::error::dist/install.sh is not deploy/install.sh: hubs would keep serving the old installer. Copy it and regenerate dist/SHA256SUMS."
            exit 1
          }
          (cd dist && sha256sum --strict -c SHA256SUMS)
          # Text-mode lines ("<sha256>  <name>"), one for every file in dist/.
          for f in dist/*; do
            n="${f#dist/}"
            case "$n" in SHA256SUMS|SHA256SUMS.minisig) continue;; esac
            grep -E '^[0-9a-f]{64}  ' dist/SHA256SUMS | cut -c67- | grep -qxF -- "$n" || {
              echo "::error::dist/SHA256SUMS has no text-mode line for $n"
              exit 1
            }
          done
      - name: build snhub
        run: cargo build -p snhub --locked
      - name: stage a release and serve it
        run: |
          rel="$RUNNER_TEMP/rel"
          mkdir -p "$rel/dist" "$rel/deploy/systemd"
          cp target/debug/snhub "$rel/dist/snhub-x86_64"
          # Stand-in agent: records how install.sh calls `sn enroll`, and every
          # command line on the machine that holds the token at that moment (the
          # installer's sh, sudo, script: all still running). With
          # /run/sn-ci-old-agent present it behaves like an sn that only takes --token.
          cat > "$rel/dist/sn-x86_64" <<'EOF'
          #!/bin/sh
          case " $* " in
            *" --version "*) echo "sn 0.0.0-ci"; exit 0;;
            *" enroll "*)
              printf 'argv:%s\nenv:%s\n' "$*" "${SN_ENROLL_TOKEN:-}" >> /run/sn-ci-enroll.log
              tok="${SN_ENROLL_TOKEN:-}"
              if [ -n "$tok" ]; then
                # tr and case keep the token off this probe's own command lines.
                for f in /proc/[0-9]*/cmdline; do
                  c="$(tr '\0' ' ' < "$f" 2>/dev/null)" || continue
                  case "$c" in *"$tok"*) printf 'leak:%s %s\n' "$f" "$c" >> /run/sn-ci-enroll.log;; esac
                done
              fi
              if [ -e /run/sn-ci-old-agent ]; then
                case " $* " in
                  *" --token "*) ;;
                  *) echo "error: the following required arguments were not provided: --token <TOKEN>" >&2; exit 2;;
                esac
              fi
              ;;
          esac
          exit 0
          EOF
          cp "$rel/dist/sn-x86_64" "$rel/dist/sn-aarch64"
          chmod 0755 "$rel/dist/sn-x86_64" "$rel/dist/sn-aarch64"
          cp dist/install.sh "$rel/dist/install.sh"
          (cd "$rel/dist" && sha256sum snhub-x86_64 sn-x86_64 sn-aarch64 install.sh > SHA256SUMS)
          cp deploy/systemd/snhub.service "$rel/deploy/systemd/"
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$rel" >/dev/null 2>&1 &
          for _ in $(seq 20); do curl -fsS -o /dev/null http://127.0.0.1:8765/dist/SHA256SUMS && break; sleep 0.5; done
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          # The annotation carries the hub's state and last log lines: job logs need a
          # sign-in to read, annotations do not.
          fail() {
            st="$(systemctl show -p ActiveState,SubState,Result,NRestarts snhub 2>/dev/null | tr '\n' ' ')"
            lg="$(sudo journalctl -u snhub -n 6 --no-pager -o cat 2>/dev/null | tr '\n' '|' | cut -c1-600)"
            echo "::error::$* [snhub: $st] [$lg]"
            exit 1
          }
          want_mode() {
            got="$(sudo stat -c '%a %U:%G' "$1")"
            [ "$got" = "$2" ] || fail "$1 is $got, want $2"
          }
          hub_checks() {
            want_mode /var/lib/snhub "700 snhub:snhub"
            db="$(sudo find /var/lib/snhub -maxdepth 1 -name 'snhub.sqlite*' -printf '%m %u:%g %p\n')"
            [ -n "$db" ] || fail "no database"
            if grep -v '^600 snhub:snhub ' <<<"$db"; then fail "database files are not 0600 snhub"; fi
            want_mode /var/lib/snhub/hub.key "640 root:snhub"
            want_mode /var/lib/snhub/public "755 root:root"
            want_mode /var/lib/snhub/public/sn-x86_64 "755 root:root"
            want_mode /var/lib/snhub/public/install.sh "644 root:root"
            want_mode /var/lib/snhub/public/SHA256SUMS "644 root:root"
            # Exactly what the scripts put there, and no temporary copy left over.
            got="$(sudo ls -A /var/lib/snhub/public | LC_ALL=C sort | tr '\n' ' ')"
            [ "$got" = "SHA256SUMS install.sh sn-aarch64 sn-x86_64 " ] || fail "public/ holds: $got"
            [ -z "$(sudo find /var/lib/snhub -maxdepth 1 -name '.public.*')" ] || fail "a temporary public/ was left behind"
            want_mode /etc/snhub "750 snhub:snhub"
            want_mode /etc/snhub/snhub.toml "640 snhub:snhub"
            [ "$(systemctl show -p UMask --value snhub)" = 0077 ] || fail "snhub.service UMask is not 0077"
            # The hub still serves what VPSes download.
            for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8099/healthz && break; sleep 1; done
            curl -fsS http://127.0.0.1:8099/install.sh | cmp - dist/install.sh
            curl -fsS http://127.0.0.1:8099/sn/sn-x86_64 | cmp - "$RUNNER_TEMP/rel/dist/sn-x86_64"
            sums="$(curl -fsS http://127.0.0.1:8099/sn/SHA256SUMS)"
            grep -q ' sn-x86_64$' <<<"$sums" || fail "/sn/SHA256SUMS lacks sn-x86_64"
            # In the service's mount namespace public/ and hub.key are read-only,
            # even to root; the rest of the data dir is not.
            pid="$(systemctl show -p MainPID --value snhub)"
            [ "$pid" -gt 0 ] || fail "snhub is not running"
            if sudo nsenter -t "$pid" -m touch /var/lib/snhub/public/probe 2>/dev/null; then fail "public/ is writable by the service"; fi
            if sudo nsenter -t "$pid" -m sh -c ': >> /var/lib/snhub/hub.key' 2>/dev/null; then fail "hub.key is writable by the service"; fi
            sudo nsenter -t "$pid" -m touch /var/lib/snhub/probe || fail "the data dir is not writable by the service"
            sudo rm -f /var/lib/snhub/probe
          }
          enrolled_has() {
            sudo grep -qxF -- "$1" /run/sn-ci-enroll.log || { sudo cat /run/sn-ci-enroll.log; fail "sn enroll was not called with: $1"; }
          }
          no_token_in_argv() {
            if sudo grep '^argv:.*--token' /run/sn-ci-enroll.log; then fail "the token reached sn's arguments"; fi
          }
          token_on_no_command_line() {
            if sudo grep '^leak:' /run/sn-ci-enroll.log; then fail "the token was on a command line while the installer ran"; fi
          }
          # The install command and the token `snhub add-vps` prints for a new VPS.
          add_vps() {
            out="$(sudo -u snhub /usr/local/bin/snhub --config /etc/snhub/snhub.toml add-vps --name "$1")"
            cmd="$(printf '%s\n' "$out" | grep -m1 '^curl ' || true)"
            tok="$(printf '%s\n' "$out" | sed -n -e 's/^Token: *//p' -e 's/.* --token \([A-Za-z0-9_-]*\).*/\1/p' | head -n 1)"
            [ -n "$cmd" ] && [ -n "$tok" ] || fail "no install command and token in: $out"
          }
          EOF
      - name: install-hub.sh
        run: |
          . "$RUNNER_TEMP/check.sh"
          sudo bash deploy/install-hub.sh --repo-raw http://127.0.0.1:8765 --public-url http://127.0.0.1:8099
          hub_checks
      - name: update-hub.sh on an install made by older scripts
        run: |
          . "$RUNNER_TEMP/check.sh"
          # What older scripts left: all of it the hub user's, a world-readable
          # database, and a unit with no UMask or read-only paths.
          sudo systemctl stop snhub
          sudo chown -R snhub:snhub /var/lib/snhub
          sudo chmod 0755 /var/lib/snhub /etc/snhub
          sudo chmod 0644 /var/lib/snhub/snhub.sqlite
          sudo chmod 0600 /var/lib/snhub/hub.key
          sudo sed -i '/^UMask=/d; /^ReadOnlyPaths=.*\/var\/lib\/snhub\//d' /etc/systemd/system/snhub.service
          sudo systemctl daemon-reload
          sudo systemctl start snhub
          # What the hub's user could leave in public/: a link where a file goes
          # (root must replace it, not write through it), a directory where a file
          # goes, and an extra file that /sn/<file> would serve.
          echo decoy | sudo tee /opt/sn-ci-decoy >/dev/null
          sudo -u snhub ln -sfn /opt/sn-ci-decoy /var/lib/snhub/public/SHA256SUMS
          sudo -u snhub rm -f /var/lib/snhub/public/install.sh
          sudo -u snhub mkdir -p /var/lib/snhub/public/install.sh/sub
          echo planted | sudo -u snhub tee /var/lib/snhub/public/extra >/dev/null
          sudo bash deploy/update-hub.sh --repo-raw http://127.0.0.1:8765
          [ "$(sudo cat /opt/sn-ci-decoy)" = decoy ] || fail "update-hub.sh wrote through a link in public/"
          sudo test -f /etc/systemd/system/snhub.service.d/10-hardening.conf || fail "no hardening drop-in"
          hub_checks
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/sn/extra)"
          [ "$code" = 404 ] || fail "the hub still serves a file planted in public/ ($code)"
          # public/ itself swapped for a link (possible while the hub's user could
          # rename it): the next update builds a real directory again.
          sudo mkdir -p /opt/sn-ci-decoy-dir
          sudo -u snhub mv /var/lib/snhub/public /var/lib/snhub/public.old
          sudo -u snhub ln -s /opt/sn-ci-decoy-dir /var/lib/snhub/public
          sudo bash deploy/update-hub.sh --repo-raw http://127.0.0.1:8765
          [ -z "$(sudo ls -A /opt/sn-ci-decoy-dir)" ] || fail "update-hub.sh wrote through a linked public/"
          sudo test ! -L /var/lib/snhub/public || fail "public/ is still a link"
          sudo rm -rf /var/lib/snhub/public.old
          hub_checks
      - name: a failed install-hub.sh or update-hub.sh run leaves the hub running
        run: |
          . "$RUNNER_TEMP/check.sh"
          # A data dir under /proc fails once the scripts have stopped the hub.
          if sudo bash deploy/install-hub.sh --repo-raw http://127.0.0.1:8765 --public-url http://127.0.0.1:8099 --data-dir /proc/sn-ci; then
            fail "install-hub.sh succeeded with an unusable data dir"
          fi
          systemctl is-active --quiet snhub || fail "a failed install-hub.sh left the hub down"
          if sudo bash deploy/update-hub.sh --repo-raw http://127.0.0.1:8765 --data-dir /proc/sn-ci; then
            fail "update-hub.sh succeeded with an unusable data dir"
          fi
          systemctl is-active --quiet snhub || fail "a failed update-hub.sh left the hub down"
          hub_checks
      # Every run goes through the hub, as on a VPS: what it serves is dist/install.sh.
      - name: install.sh keeps the enrollment token off every command line
        run: |
          . "$RUNNER_TEMP/check.sh"
          hub=http://127.0.0.1:8099
          # Installed here, without a terminal, so the runs below never meet an apt prompt.
          command -v nft >/dev/null || sudo apt-get install -y -qq nftables
          # No token and no terminal: stop before changing anything, and say how
          # to pass it without a command line.
          if curl -fsSL "$hub/install.sh" | sudo sh -s -- --hub "$hub" --name ci-01 2>"$RUNNER_TEMP/err"; then
            fail "install.sh ran without a token"
          fi
          grep -q -- '--preserve-env=SN_ENROLL_TOKEN' "$RUNNER_TEMP/err" || fail "no hint about SN_ENROLL_TOKEN"
          [ ! -e /usr/local/bin/sn ] || fail "installed before it had a token"
          # The token typed on the terminal, as under `curl | sudo sh`. An earlier
          # `sn triage` from a umask-022 root shell left /var/lib/sn 0755.
          sudo mkdir -p /var/lib/sn
          sudo chmod 0755 /var/lib/sn
          printf 'tok-tty-1\n' | sudo script -qec "curl -fsSL $hub/install.sh | sh -s -- --hub $hub --name ci-01" /dev/null
          enrolled_has 'env:tok-tty-1'
          enrolled_has "argv:--config /etc/sn/agent.toml enroll --url $hub --name ci-01"
          no_token_in_argv
          token_on_no_command_line
          want_mode /var/lib/sn "700 root:root"
          # The old --token form still works, with a warning, and still hands sn
          # the token in the environment. Its own command line holds the token,
          # which the probe must see.
          sudo rm -f /run/sn-ci-enroll.log
          curl -fsSL "$hub/install.sh" | sudo sh -s -- --hub "$hub" --name ci-02 --token tok-arg-1 2>"$RUNNER_TEMP/err"
          grep -q -- '--token: every local user' "$RUNNER_TEMP/err" || fail "no warning for --token"
          enrolled_has 'env:tok-arg-1'
          no_token_in_argv
          sudo grep -q '^leak:' /run/sn-ci-enroll.log || fail "the probe missed the token on the --token command line"
          # Automation without a terminal, through sudo: exported, then preserved.
          sudo rm -f /run/sn-ci-enroll.log
          export SN_ENROLL_TOKEN=tok-env-1
          curl -fsSL "$hub/install.sh" | sudo --preserve-env=SN_ENROLL_TOKEN sh -s -- --hub "$hub" --name ci-03
          unset SN_ENROLL_TOKEN
          enrolled_has 'env:tok-env-1'
          no_token_in_argv
          token_on_no_command_line
          # Automation without a terminal, as root: exported in the root shell.
          sudo rm -f /run/sn-ci-enroll.log
          sudo bash -s <<EOF
          export SN_ENROLL_TOKEN=tok-root-1
          curl -fsSL $hub/install.sh | sh -s -- --hub $hub --name ci-05
          EOF
          enrolled_has 'env:tok-root-1'
          no_token_in_argv
          token_on_no_command_line
          # An sn that only takes --token gets it that way.
          sudo rm -f /run/sn-ci-enroll.log
          sudo touch /run/sn-ci-old-agent
          export SN_ENROLL_TOKEN=tok-old-1
          curl -fsSL "$hub/install.sh" | sudo --preserve-env=SN_ENROLL_TOKEN sh -s -- --hub "$hub" --name ci-04
          unset SN_ENROLL_TOKEN
          enrolled_has "argv:--config /etc/sn/agent.toml enroll --url $hub --name ci-04 --token tok-old-1"
          sudo rm -f /run/sn-ci-old-agent
          # --upgrade tightens a loose /var/lib/sn too.
          sudo chmod 0755 /var/lib/sn
          curl -fsSL "$hub/install.sh" | sudo sh -s -- --hub "$hub" --upgrade
          want_mode /var/lib/sn "700 root:root"
      # The command the hub gives for a new VPS is the main way in: the token is
      # shown apart from it and typed when the installer asks.
      - name: the install command the hub prints carries no token
        run: |
          . "$RUNNER_TEMP/check.sh"
          hub=http://127.0.0.1:8099
          add_vps ci-06
          case "$cmd" in *--token*|*"$tok"*) fail "the install command carries the token: $cmd";; esac
          [ "$cmd" = "curl -fsSL $hub/install.sh | sudo sh -s -- --hub $hub --name ci-06" ] || fail "unexpected install command: $cmd"
          # Run as an admin would, typing the token when asked (as root inside a
          # terminal, which is what the command's `sudo sh` gives).
          sudo rm -f /run/sn-ci-enroll.log
          printf '%s\n' "$tok" | sudo script -qec "${cmd/| sudo sh/| sh}" /dev/null
          enrolled_has "env:$tok"
          enrolled_has "argv:--config /etc/sn/agent.toml enroll --url $hub --name ci-06"
          no_token_in_argv
          token_on_no_command_line
      # The installer hands the token over in the environment; an agent built
      # before that only takes --token, and enrolling then puts it in its argv.
      # Run even after a failure above, so a stale dist/ is reported too.
      - name: the agent in dist/ enrolls with the token in its environment
        if: ${{ !cancelled() }}
        run: |
          . "$RUNNER_TEMP/check.sh"
          add_vps ci-dist
          install -m 0755 dist/sn-x86_64 "$RUNNER_TEMP/sn-dist"
          rc=0
          SN_ENROLL_TOKEN="$tok" "$RUNNER_TEMP/sn-dist" --config "$RUNNER_TEMP/agent.toml" \
            enroll --url http://127.0.0.1:8099 --name ci-dist || rc=$?
          [ "$rc" -ne 2 ] || fail "dist/sn-x86_64 takes the token only as an argument: rebuild dist/ from this tree"
          [ "$rc" -eq 0 ] || fail "dist/sn-x86_64 could not enroll (exit $rc)"

  audit:
    name: cargo audit + deny (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit,cargo-deny
      - name: audit
        run: cargo audit
      - name: deny
        run: cargo deny check
