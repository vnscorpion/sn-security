# Reference copy of the PHP web-shell heuristic compiled into `sn`
# (crates/common/src/heuristic.rs). Score >= 100 = malicious (certain enough for
# `sn clean` to quarantine), 70-99 = suspicious (for a human), below = clean.
#
# Design rule: a false "malicious" on legitimate code (WordPress core!) is worse
# than a miss, so rules need the evidence to be IN the call, not merely nearby.
#
# Regression set: `cargo run -p snsec-common --release --example scan_dir -- <dir>`
# over WordPress core + popular plugins must flag nothing (9,024 files at 0.3.1).

definitions:
  bare_call: >
    `name(` that is not the tail of a longer identifier (WP_Filesystem( is not
    system(), not a method/static call ($pdo->exec(, Foo::exec(), and not a
    definition (function exec().
  in_arguments: >
    Inside the call's argument text (to the end of the statement, max 240 bytes).
    For call_user_func / call_user_func_array only the FIRST argument counts: the
    rest is data handed to a callback.
  from_input: $_POST $_GET $_REQUEST $_COOKIE $_SERVER $_FILES php://input
  tainted_variable: >
    A variable whose assignment BEGINS with request input, bare or through a plain
    PHP decoder/trimmer (trim, stripslashes, urldecode, base64_decode, ...).
    `isset($_GET[x]) ? ..` and sanitizers (intval, sanitize_*) do not taint. A
    tainted variable used as an array key ($registry[ $name ]) does not count.

rules:
  - name: source-to-sink
    weight: 100            # malicious on its own
    when: request input is in the arguments of a bare eval/assert/system/exec/shell_exec/passthru/popen/proc_open/pcntl_exec/create_function/call_user_func(_array) call
  - name: input-as-function
    weight: 100            # malicious on its own
    when: $_POST['f'](...)  — the request chooses which function runs
  - name: tainted-to-sink
    weight: 70             # suspicious on its own, never auto-quarantined
    when: a tainted variable is in the arguments of one of those calls
  - name: decoded-to-sink
    weight: 100            # malicious on its own
    when: the tainted variable was decoded on the way (base64_decode, hex2bin, gzinflate, str_rot13, strrev), also through other wrappers
  - name: tainted-command-capture
    weight: 100            # malicious on its own
    when: a tainted variable is run by a command call whose arguments fold the errors into the output (2>&1), as a web shell does to show them on the page
  - name: decode-into-eval
    weight: 60             # 80 when two or more decoders chain
    when: base64_decode/gzinflate/gzuncompress/str_rot13/strrev/hex2bin/... inside a bare eval/assert
  - name: preg_replace-e
    weight: 60
    when: preg_replace( with a pattern string whose modifiers include `e` (not preg_replace_callback, not the letters "/e" elsewhere)
  - name: command-sink
    weight: 20
    when: a bare system/shell_exec/passthru/proc_open call exists at all
  - name: dropper
    weight: 40
    when: move_uploaded_file/file_put_contents/fwrite takes request input, or the file fetches http content
  - name: obfuscated-variable
    weight: 20
    when: ${'...  built from string pieces
  - name: long-base64
    weight: 30             # 15 in a file over 20 KB
    when: a base64-looking run longer than 512 characters
  - name: high-entropy-literal
    weight: 25
    when: a string literal over 256 bytes with entropy above 5.2 bits/byte
  - name: php-in-image-ext
    weight: 50
  - name: php-in-uploads
    weight: 40

  # Placement rules for PHP files (kept for score_php callers that pass the flags).
  # `sn hunt` no longer scores pictures with them: see `images:` below.

images:
  # score_image(): a file named like a picture, judged by its first bytes.
  # Kinds: image (JPEG/PNG/GIF/WebP/BMP/ICO/TIFF/HEIF), svg, executable, archive,
  # text, other. Read whole up to 2 MB, else first + last 512 KB.
  php_open_tag: >
    `<?php`+whitespace, `<?=` (needs `$` or `(`), `<script language="php">`, and
    `<?`+whitespace in text kinds only. Case-insensitive. The tag counts only when
    >= 4 text bytes follow (>= 8 for the short forms): chance bytes in compressed
    picture data are not code.
  rules:
    - {name: php-in-image,          weight: 70,  when: PHP open tag followed by code; the code around it is scored by score_php and added}
    - {name: executable-as-image,   weight: 100, when: ELF / MZ+PE / "#!" with an image name}
    - {name: archive-as-image,      weight: 70,  when: zip / rar / gzip / 7z with an image name}
    - {name: text-in-image-name,    weight: 40,  when: image name, text content}
    - {name: double-extension,      weight: 40,  when: "x.php.jpg": a script part before the picture extension}
    - {name: script-in-image,       weight: 40,  when: "<script"}
    - {name: remote-script,         weight: 40,  when: "<script" loading src/href from another address}
    - {name: event-handler-in-image, weight: 30, when: " onload=", " onerror=" ... (known event names)}
    - {name: javascript-uri,        weight: 50,  when: "javascript:"}
    - {name: embedded-frame,        weight: 30,  when: "<foreignobject", "<iframe", "<embed", "<object"}
    - {name: data-html-uri,         weight: 40,  when: "data:text/html"}
    - {name: js-obfuscation,        weight: 50,  when: eval( atob( fromcharcode unescape( document.write( new function( -- ONLY with script present}
    - {name: js-exfil-redirect,     weight: 30,  when: document.cookie localstorage window.location location.href fetch( ... -- ONLY with script present}
    - {name: appended-text,         weight: 40,  when: >= 32 bytes of text at the very end of a real raster picture}
    - {name: appended-code,         weight: 40,  when: that trailing text has script / decoder words}

config:
  # score_config(): .htaccess (line by line, comments skipped, <FilesMatch>/<Files>
  # blocks tracked) and .user.ini / php.ini / .php.ini.
  rules:
    - {name: config-image-as-code,         weight: 100, when: AddHandler/AddType with a php/cgi handler for an image extension, or SetHandler/ForceType php inside a <FilesMatch>/<Files> naming pictures}
    - {name: config-auto-include-nonphp,   weight: 100, when: auto_prepend_file / auto_append_file points at a file that is not PHP}
    - {name: config-auto-include-odd-path, weight: 80,  when: it points at PHP in uploads/, cache/, tmp/, wp-content/upgrade/ or a hidden folder}
    - {name: config-data-as-code,          weight: 60,  when: AddHandler/AddType php for txt/css/js/json/pdf/zip/...}
    - {name: config-allow-url-include,     weight: 50,  when: allow_url_include on}
  not_flagged:
    - AddHandler php for .html/.htm (common, legitimate)
    - PHP-FPM SetHandler for \.php$
    - cPanel ea-php AddHandler for .php/.phtml
    - auto_prepend_file pointing at a PHP file in a normal folder (security plugins)

removed:
  - backtick-exec          # two backticks matched markdown in comments
  - variable-function      # replaced by input-as-function (precise)

notes:
  - Commercial encoders (ionCube, SourceGuardian, Zend) are classified
    `encoded-commercial` and are not scored on entropy/base64. `sn hunt` does
    not list them as findings: a file that only names an encoder is nothing to act on.
  - input-as-function needs what follows the `(` to look like arguments
    (`$`, a quote, a number, a call), so a docblock saying
    `$_SERVER['HTTP_HOST'] (if any)` is not a call.
  - args_window ends at the call's closing bracket (brackets inside quotes do
    not count) or at `;`.
  - Test tooling (a file under /vendor/phpunit/, any .phar) is not "malicious"
    on weak rules alone: without one of source-to-sink, input-as-function,
    decode-into-eval, preg_replace-e, decoded-to-sink, tainted-command-capture
    it is capped at 99 (suspicious) and gets the rule `known-dev-tool`.
  - SCORER_VERSION (3) is written into every scan result; an agent drops a
    result of an older version.
  - Known gaps: function names built by concatenation ($f = 'ev'.'al'; $f($x)),
    non-PHP injections (JavaScript, database), no WordPress core/plugin checksum
    comparison yet, detection rate never measured on a real malware corpus.
